<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ақсұлтан &amp; Наирим — той шақыруы</title>
  <meta name="theme-color" content="#FBF6EA">
  <link rel="preload" href="assets/fonts/caveat-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/caveat-cyr-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/kids.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">

    <!-- Верхняя волна с сердечками -->
    <img class="deco wave-top" src="assets/wave-top.svg" alt="">
    <img class="deco heart-on-wave" src="assets/heart.svg" alt="">

    <!-- Детские фото с репликами -->
    <section class="childhood">
      <p class="quote quote-left"><span class="q-type">- Есейгенде әйелім кім болады екен?</span></p>
      <p class="quote quote-right"><span class="q-type">- Ол — мен боламын!</span></p>
      <img class="kids-photo" src="assets/kids.jpg" alt="Ақсұлтан мен Наирим балалық шақта">
    </section>

    <!-- Лента с именами -->
    <h1 class="banner">Ақсұлтан &amp; Наирим</h1>

    <!-- Приглашение -->
    <section class="invite">
      <img class="deco heart-invite" src="assets/heart.svg" alt="">
      <p class="invite-text">Құрметті туыстар мен достар,<br>сіздерді үйлену тойымызға шақырамыз!</p>
    </section>

    <!-- Дата и время на фоне волны -->
    <section class="datetime">
      <img class="deco mid-strip" src="assets/mid-strip.png" alt="">
      <img class="deco heart-mid" src="assets/heart.svg" alt="">
      <img class="deco heart-left" src="assets/heart-r.svg" alt="">
      <p class="date">31.10.2026</p>
      <p class="time">16:00</p>
    </section>

    <!-- Адрес -->
    <section class="venue">
      <div class="pink-bg"></div>
      <img class="deco pink-bottom" src="assets/pink-bottom.png" alt="">
      <h2 class="venue-title">Мекенжай</h2>
      <img class="deco underline" src="assets/underline.png" alt="">
      <p class="address">Лермонтова 1а<br>“Residence” мейрамханасы</p>
      <figure class="venue-card">
        <img class="venue-photo" src="assets/venue.jpg" alt="«Residence» мейрамханасы">
      </figure>
    </section>

    <!-- Финальный блок -->
    <footer class="closing">
      <p class="closing-text">Сіздерді асыға күтеміз!<br>Құрметпен той иелері:<br>Азамат пен Баршагүл.</p>
      <img class="deco wave-left" src="assets/wave-left.png" alt="">
      <img class="deco bottom-strip" src="assets/bottom-strip.png" alt="">
      <img class="deco heart-corner" src="assets/heart.svg" alt="">
    </footer>

  </main>

  <!-- Фоновая музыка: ДОС МУКАСАН — Той жыры -->
  <audio id="bg-music" src="assets/toi-zhyry.mp3" loop preload="none"></audio>
  <button id="music-btn" type="button" aria-label="Музыканы қосу/өшіру" title="Музыка"><span id="music-ico">♪</span></button>
  <script>
    (function () {
      var audio = document.getElementById('bg-music');
      var btn = document.getElementById('music-btn');
      var userPaused = false;

      function fadeIn() {
        audio.volume = 0;
        var v = 0;
        var timer = setInterval(function () {
          v = Math.min(0.8, v + 0.05);
          audio.volume = v;
          if (v >= 0.8) clearInterval(timer);
        }, 120);
      }

      function tryPlay() {
        if (!audio.paused || userPaused) return;
        audio.play().then(fadeIn).catch(function () {});
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) { userPaused = false; tryPlay(); }
        else { userPaused = true; audio.pause(); }
      });

      var ico = document.getElementById('music-ico');
      audio.addEventListener('play', function () { btn.classList.add('playing'); ico.textContent = '♫'; });
      audio.addEventListener('pause', function () { btn.classList.remove('playing'); ico.textContent = '♪'; });

      // Автозапуск со звуком браузеры блокируют до первого действия
      // пользователя — пробуем сразу, а дальше стартуем с первого касания.
      // Касания самой кнопки глобальный обработчик пропускает, иначе
      // pointerdown включал бы музыку, а следующий за ним click выключал.
      function globalTry(e) {
        if (e && e.target && e.target.closest && e.target.closest('#music-btn')) return;
        tryPlay();
      }
      tryPlay();
      addEventListener('pointerdown', globalTry);
      addEventListener('keydown', globalTry);
    })();
  </script>

  <script src="assets/typed.min.js"></script>
  <script>
    // Диалог сверху печатается по очереди, как живой разговор
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !window.Typed) return;
      var spans = document.querySelectorAll('.q-type');
      if (spans.length < 2) return;
      var t1 = spans[0].textContent, t2 = spans[1].textContent;
      spans[0].textContent = '';
      spans[1].textContent = '';

      function type(el, text, next) {
        new Typed(el, {
          strings: [text],
          typeSpeed: 45,
          showCursor: true,
          cursorChar: '|',
          onComplete: function (self) {
            if (self.cursor) self.cursor.remove();
            if (next) next();
          }
        });
      }

      // «думающие» смайлики всплывают возле второй реплики,
      // пока девочка готовит ответ
      function thinkBubbles() {
        var card = document.querySelector('.card');
        for (var i = 0; i < 4; i++) {
          setTimeout(function () {
            var s = document.createElement('span');
            s.className = 'think-emoji';
            s.textContent = '🤔';
            s.style.left = (58 + Math.random() * 20) + '%';
            s.style.top = (12.5 + Math.random() * 2) + '%';
            s.style.fontSize = (4.5 + Math.random() * 2.5) + 'cqw';
            card.appendChild(s);
            setTimeout(function () { s.remove(); }, 2100);
          }, i * 400);
        }
      }

      var startTyping = function () {
        setTimeout(function () {
          type(spans[0], t1, function () {
            thinkBubbles();
            setTimeout(function () {
              // после её ответа — конфетти
              type(spans[1], t2, function () {
                if (window.startCelebration) setTimeout(window.startCelebration, 400);
              });
            }, 1700);
          });
        }, 500);
      };
      if (document.readyState === 'complete') startTyping();
      else addEventListener('load', startTyping);
    })();
  </script>
  <script src="assets/confetti.min.js"></script>
  <script>
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !window.confetti) return;
      var colors = ['#E03059', '#CB4363', '#DA2D55', '#F0A8B8', '#E8C36A'];
      var fired = false;

      // запускается после её ответа в диалоге
      window.startCelebration = function () {
        if (fired) return;
        fired = true;

        confetti({ particleCount: 90, spread: 75, origin: { y: 0.3 }, colors: colors });
        setTimeout(function () {
          confetti({ particleCount: 45, angle: 60, spread: 55, origin: { x: 0, y: 0.45 }, colors: colors });
          confetti({ particleCount: 45, angle: 120, spread: 55, origin: { x: 1, y: 0.45 }, colors: colors });
        }, 400);

        // лёгкие повторные всплески
        setInterval(function () {
          confetti({
            particleCount: 24,
            spread: 65,
            scalar: 0.9,
            ticks: 220,
            origin: { x: 0.2 + Math.random() * 0.6, y: 0.25 },
            colors: colors
          });
        }, 8000);
      };

      // запасной запуск, если диалог не анимируется (нет Typed.js)
      if (!window.Typed) {
        addEventListener('load', function () { setTimeout(window.startCelebration, 800); });
      }
    })();
  </script>

</body>
</html>
